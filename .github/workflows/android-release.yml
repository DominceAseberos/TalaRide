name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to build and publish
        required: true
        default: v1.2.3

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_SIGNER_SHA256: E7:14:87:90:93:DB:3A:6E:24:5D:49:22:78:AD:B3:67:48:A0:EF:69:5A:62:78:4B:D0:14:66:C0:30:C9:14:D8

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Align pnpm with the release lockfile
        run: |
          node -e "const fs=require('fs'); const p=require('./package.json'); p.packageManager='pnpm@9.15.9'; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\\n')"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write production mobile environment
        shell: bash
        run: |
          cat > mobile/.env.production <<'EOF'
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_WEB_API=${{ secrets.EXPO_PUBLIC_WEB_API }}
          EXPO_PUBLIC_PAYMENT_MODE=${{ secrets.EXPO_PUBLIC_PAYMENT_MODE }}
          EXPO_PUBLIC_VEHICLE_QR_BASE=${{ secrets.EXPO_PUBLIC_VEHICLE_QR_BASE }}
          EXPO_PUBLIC_QR_EXPIRY_SEC=${{ secrets.EXPO_PUBLIC_QR_EXPIRY_SEC }}
          EXPO_PUBLIC_DEMO_MODE=${{ secrets.EXPO_PUBLIC_DEMO_MODE }}
          EOF

      - name: Verify release environment
        run: pnpm --filter @talaride/mobile release:verify-env

      - name: Generate native Android project
        env:
          NODE_ENV: production
          CI: "1"
        run: |
          cd mobile
          npx expo prebuild --platform android --clean --no-install

      - name: Configure permanent release signing
        shell: bash
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > mobile/android/app/talaride-release.jks
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("mobile/android/app/build.gradle")
          text = path.read_text()

          marker = "    signingConfigs {\n"
          if marker not in text:
              raise SystemExit("Android signingConfigs block was not found.")

          release = """        release {
              storeFile file('talaride-release.jks')
              storePassword System.getenv('TALARIDE_UPLOAD_STORE_PASSWORD')
              keyAlias System.getenv('TALARIDE_UPLOAD_KEY_ALIAS')
              keyPassword System.getenv('TALARIDE_UPLOAD_KEY_PASSWORD')
          }
          """
          if "storeFile file(TALARIDE_UPLOAD_STORE_FILE)" not in text:
              pos = text.index(marker) + len(marker)
              text = text[:pos] + release + text[pos:]

          pattern = r"(buildTypes\s*\{.*?\brelease\s*\{.*?signingConfig\s+)signingConfigs\.debug"
          text, count = re.subn(pattern, r"\1signingConfigs.release", text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Android release signing assignment was not found.")

          path.write_text(text)
          PY

      - name: Verify signing certificate
        shell: bash
        run: |
          ACTUAL="$(keytool -list -v             -keystore mobile/android/app/talaride-release.jks             -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"             -alias "${{ secrets.ANDROID_KEY_ALIAS }}"             | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          echo "Release signer SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED_SIGNER_SHA256"

      - name: Build signed Android APK
        env:
          NODE_ENV: production
          CI: "1"
          TALARIDE_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TALARIDE_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TALARIDE_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd mobile/android
          ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify finished APK signer and package
        shell: bash
        run: |
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          ACTUAL="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          EXPECTED="$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | sed -n '1p' > apk-package.txt
          grep -F "name='com.beepanjero.talaride'" apk-package.txt
          grep -F "versionName='${RELEASE_TAG#v}'" apk-package.txt

      - name: Prepare release assets
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          APK="TalaRide-v${VERSION}.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "APK_NAME=$APK" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: talaride-${{ env.RELEASE_TAG }}-android
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Verify published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isDraft,publishedAt,assets,url
