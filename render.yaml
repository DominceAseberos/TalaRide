services:
  - type: web
    name: talaride-web
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_MODE
        value: mock
      - key: PAYMENT_ENVIRONMENT
        value: test
      - key: PAYMENT_SIMULATION_ENABLED
        value: "true"
      - key: DEMO_AUTH
        value: "false"
      - key: ALLOW_EPHEMERAL_STATE
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: QR_INTENT_SECRET
        sync: false
      - key: PAYMENT_PROVIDER_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: PUBLIC_WEB_ORIGIN
        sync: false
